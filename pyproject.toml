[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mewcode"
version = "0.1.0"
description = "A terminal AI coding assistant with multi-LLM support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MewCode Team" },
]

dependencies = [
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mewcode = "mewcode.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
