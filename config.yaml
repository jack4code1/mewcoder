# MewCode 配置文件

# LLM 配置
llm:
  # 默认模型
  default_model: "mimo-v2.5-pro"
  default_provider: "custom"

  # 模型配置
  models:
    mimo-v2.5-pro:
      provider: "custom"
      base_url: "https://token-plan-cn.xiaomimimo.com/v1"
      api_key: "tp-ckg4u5c9o7dkg07yw1i72bogp7vtfljfm6gc34zkfn0fjw57"
      api_format: "openai"
      model: "mimo-v2.5-pro"

# 会话配置
session:
  storage_dir: "~/.mewcode/sessions"
  auto_save: true

# TUI 配置
tui:
  theme: "default"
  show_token_usage: true
  show_session_duration: true
