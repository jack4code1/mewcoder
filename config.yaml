# MewCode 配置文件

# LLM 配置
llm:
  # 默认模型
  default_model: "glm-5.2"
  default_provider: "openai"

  # 模型配置
  models:
    glm-5.2:
      provider: "openai"
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      api_key_env: "ZAI_API_KEY"
      model: "glm-5.2"

    mimo-v2.5-pro:
      provider: "custom"
      base_url: "https://token-plan-cn.xiaomimimo.com/v1"
      api_key_env: "MIMO_API_KEY"
      # Put any local fallback key in ignored config.local.yaml, never here.
      api_format: "openai"
      model: "mimo-v2.5-pro"

    gemma4-12b-it-qat:
      provider: "ollama"
      base_url: "http://localhost:11434"
      api_format: "openai"
      model: "gemma4-12b-it-qat"

# 会话配置
session:
  storage_dir: "~/.mewcode/sessions"
  auto_save: true
  restore_last: true

# Automatically use planning only for clearly multi-step coding tasks.
agent:
  routing:
    auto_plan: true
    llm_router: true
    complexity_threshold: 3
    runtime_escalation: true

memory:
  retrieval_limit: 8
  auto_extract: true
  embedding:
    enabled: true
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    model: "embedding-3"
    dimensions: 512
    api_key_env: "ZAI_API_KEY"

# TUI 配置
tui:
  theme: "default"
  show_token_usage: true
  show_session_duration: true

# 工具子系统(02-tools 章节新增)
# State-changing tools require approval by default. Trusted automation may
# explicitly set this to false in config.local.yaml.
security:
  enabled: true
  approval_timeout_seconds: 300

tools:
  enabled: "all"           # "all" | "readonly" | [ReadFile, Glob, Grep, ...]
  bash_timeout: 30          # Bash 工具默认超时(秒),max 600
  max_output_chars: 10000   # 单个工具返回内容上限

# Optional MCP stdio servers. Servers are disabled until explicitly enabled
# here and connected with `/mcp connect <name>`.
mcp:
  servers: []
