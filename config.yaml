# MewCode 配置文件

# LLM 配置
llm:
  # 默认模型
  default_model: "mimo-v2.5-pro"
  default_provider: "custom"

  # 模型配置
  models:
    mimo-v2.5-pro:
      provider: "custom"
      base_url: "https://token-plan-cn.xiaomimimo.com/v1"
      api_key_env: "MIMO_API_KEY"
      # Put any local fallback key in ignored config.local.yaml, never here.
      api_format: "openai"
      model: "mimo-v2.5-pro"

    gemma4-12b-it-qat:
      provider: "ollama"
      base_url: "http://localhost:11434"
      api_format: "openai"
      model: "gemma4-12b-it-qat"

# 会话配置
session:
  storage_dir: "~/.mewcode/sessions"
  auto_save: true

# TUI 配置
tui:
  theme: "default"
  show_token_usage: true
  show_session_duration: true

# 工具子系统(02-tools 章节新增)
# Security is opt-in for backward compatibility; enabled projects require
# approval before state-changing tools run.
security:
  enabled: false
  approval_timeout_seconds: 300

tools:
  enabled: "all"           # "all" | "readonly" | [ReadFile, Glob, Grep, ...]
  bash_timeout: 30          # Bash 工具默认超时(秒),max 600
  max_output_chars: 10000   # 单个工具返回内容上限
